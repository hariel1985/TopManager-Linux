name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked
      - run: scripts/check-version.sh

  # Package the release tarball, then install and run it as a *different*
  # user with a non-standard home directory. Fails if anything assumes the
  # build user's name or paths.
  portable-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools dbus libglib2.0-bin
      - run: scripts/package.sh
      - name: Install and run as another user
        run: |
          set -eux
          sudo mkdir -p /srv/elsewhere
          sudo useradd --create-home --home-dir /srv/elsewhere/someone-else --shell /bin/bash tmtester
          PAYLOAD="$PWD/dist/$(ls dist | grep -v '\.tar\.gz' | head -n1)"
          sudo cp -r "$PAYLOAD" /srv/elsewhere/payload
          sudo cp scripts/ci-portable-install.sh /srv/elsewhere/
          sudo chown -R tmtester /srv/elsewhere/payload
          # -i: a clean login environment, nothing inherited from the runner.
          sudo -iu tmtester bash /srv/elsewhere/ci-portable-install.sh /srv/elsewhere/payload /tmp/tm-backup.json
          # Nothing the other user got may point at the build user or checkout.
          if sudo grep -rIl -e "$GITHUB_WORKSPACE" -e "/home/runner" /srv/elsewhere/someone-else /tmp/tm-backup.json; then
            echo "found build-machine paths in the installed files" >&2
            exit 1
          fi
