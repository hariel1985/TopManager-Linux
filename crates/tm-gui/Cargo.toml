[package]
name = "tm-gui"
description = "TopManager main window (GTK4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "topmanager"
path = "src/main.rs"

[dependencies]
tm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Oldest supported target: Ubuntu 24.04 (GTK 4.14, libadwaita 1.5).
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
